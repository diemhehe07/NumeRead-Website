<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NumeRead">
  <title>NumeRead - Login</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/numeread-icon.svg" type="image/svg+xml">
</head>
<body class="page">
  <main class="layout">
    <header class="header">
      <div class="brand">
        <i class="fas fa-chalkboard-user brand-icon"></i>
        <span class="brand-name">Nume<span class="accent">Read</span></span>
      </div>
      <p class="tagline">Adaptive remedial instruction - Literacy & Numeracy</p>
      <p data-login-status class="status" aria-live="polite"></p>
    </header>

    <div class="portals">
      <section class="portal student">
        <div class="portal-header">
          <div class="portal-icon">
            <i class="fas fa-user-graduate"></i>
          </div>
          <h2 class="title">Student Access</h2>
          <p class="description">Sign in with your registered details</p>
        </div>
        <form class="form" action="student.html" method="GET" target="_self" data-student-form>
          <div class="field">
            <label class="label">Registered Full Name</label>
            <input type="text" name="studentName" class="input" placeholder="Enter your registered full name" autocomplete="name" required>
          </div>
          <div class="field">
            <label class="label">Learner's Reference Number (LRN)</label>
            <input type="text" name="lrn" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" class="input" placeholder="12-digit LRN" autocomplete="off" required>
          </div>
          <button type="submit" class="action">
            <i class="fas fa-sign-in-alt"></i> Continue to Learning
          </button>
        </form>
        <div class="account">
          <a href="register.html" class="link">
            <i class="fas fa-user-plus"></i> Create New Account
          </a>
        </div>
      </section>

      <section class="portal teacher">
        <div class="portal-header">
          <div class="portal-icon">
            <i class="fas fa-chalkboard-teacher"></i>
          </div>
          <h2 class="title">Teacher Portal</h2>
          <p class="description">Monitor and manage class progress</p>
        </div>
        <form class="form" data-teacher-form>
          <div class="field">
            <label class="label">Email / Username</label>
            <input type="email" name="email" class="input" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="label">Password</label>
            <input type="password" name="password" class="input" autocomplete="current-password" required>
          </div>
          <button type="submit" class="action">
            <i class="fas fa-chalkboard"></i> Access Admin Dashboard
          </button>
        </form>
        <div class="account"><a href="teacher-register.html" class="link"><i class="fas fa-user-plus"></i> Create teacher account</a></div>
      </section>
    </div>
    <aside class="install-app" aria-label="Install NumeRead">
      <span class="install-app__icon" aria-hidden="true"><i class="fas fa-mobile-screen-button"></i></span>
      <div>
        <strong>Take NumeRead with you</strong>
        <p data-install-message>Install it on your phone for a full-screen app experience.</p>
      </div>
      <button type="button" class="install-app__button" data-install-app hidden>Install app</button>
    </aside>
  </main>
  <script src="firebase-config.js"></script>
  <script src="numeread-data.js"></script>
  <script src="index-app.js"></script>
  <script src="pwa-init.js"></script>
</body>
</html>
